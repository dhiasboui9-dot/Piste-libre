<!-- 2) Colle cette section où tu veux (par ex. avant la section "Outils") -->
<section id="course" style="padding:24px 16px;max-width:520px;margin:auto;text-align:center">
  <h2>Course en direct</h2>
  <p>Après chaque kilomètre, la voix annonce le numéro du km, ton temps total, ton rythme et tes pas. Tu peux verrouiller l'écran : la course continue jusqu'à « Arrêter ».</p>

  <div id="cv-live" style="font-size:1.1rem;margin:16px 0;line-height:1.7">
    Distance : <b id="cv-dist">0.00</b> km<br>
    Temps : <b id="cv-time">0:00</b><br>
    Rythme moyen : <b id="cv-avg">–</b> /km<br>
    Pas : <b id="cv-steps">0</b>
  </div>

  <button id="cv-start" style="padding:14px 28px;font-size:1.1rem;border-radius:12px;border:0;background:#16a34a;color:#fff">Démarrer</button>
  <button id="cv-stop" style="padding:14px 28px;font-size:1.1rem;border-radius:12px;border:0;background:#dc2626;color:#fff;display:none">Arrêter</button>
  <p id="cv-msg" style="font-size:.9rem;opacity:.75;margin-top:12px"></p>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let watchId = null, wakeLock = null, timerId = null, keepAudio = null, silenceUrl = null;
  let running = false;
  let km, dist, prev, steps, tStart, tKm, stepsKm, lastStep;

  // --- Utilitaires ---
  const R = 6371000;
  function haversine(a, b) {
    const rad = x => x * Math.PI / 180;
    const dLat = rad(b.latitude - a.latitude);
    const dLon = rad(b.longitude - a.longitude);
    const h = Math.sin(dLat / 2) ** 2 +
      Math.cos(rad(a.latitude)) * Math.cos(rad(b.latitude)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const pad = n => String(n).padStart(2, '0');
  function clock(s) {
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60);
  }
  function parle_duree(s) {
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    let t = '';
    if (h) t += h + (h > 1 ? ' heures ' : ' heure ');
    if (m || h) t += m + (m > 1 ? ' minutes ' : ' minute ');
    t += sec + (sec > 1 ? ' secondes' : ' seconde');
    return t;
  }
  function parle(txt) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'fr-FR';
    const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('fr'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }

  // --- Affichage (basé sur l'horloge : toujours juste, même écran éteint) ---
  function draw() {
    if (!running) return;
    const t = (Date.now() - tStart) / 1000;
    $('cv-time').textContent = clock(t);
    $('cv-steps').textContent = steps;
    $('cv-dist').textContent = (dist / 1000).toFixed(2);
    if (dist >= 50) {
      const s = Math.round(t / (dist / 1000));
      $('cv-avg').textContent = Math.floor(s / 60) + ':' + pad(s % 60);
    }
  }

  // --- Pas (estimation par accéléromètre) ---
  function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a) return;
    const m = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    const now = Date.now();
    if (m > 13 && now - lastStep > 250) { steps++; lastStep = now; }
  }

  // --- GPS ---
  function onPos(p) {
    if (!running) return;
    const c = p.coords;
    if (c.accuracy > 30) return;                 // ignore les points imprécis
    if (prev) {
      const d = haversine(prev, c);
      if (d < 3) return;                         // ignore le bruit à l'arrêt
      dist += d;
    }
    prev = c;
    draw();

    if (dist >= km * 1000) {
      const now = Date.now();
      const total = (now - tStart) / 1000;
      const split = (now - tKm) / 1000;
      parle(
        `Kilomètre ${km}. ` +
        `Temps total : ${parle_duree(total)}. ` +
        `Rythme de ce kilomètre : ${parle_duree(split)}. ` + `Rythme moyen : ${parle_duree(total / (dist / 1000))} par kilomètre. ` +
        `${steps - stepsKm} pas.`
      );
      km++; tKm = now; stepsKm = steps;
    }
  }
  function startWatch() {
    if (watchId !== null || !navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(onPos,
      () => $('cv-msg').textContent = 'GPS : autorise la localisation pour continuer.',
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  }
  function restartWatch() {
    if (watchId !== null) { try { navigator.geolocation.clearWatch(watchId); } catch (e) {} watchId = null; }
    startWatch();
  }

  // --- Maintien en vie écran éteint (son silencieux) ---
  function makeSilence() {
    const rate = 8000, n = rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, s) => { for (let k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  function startKeepAlive() {
    try {
      if (!keepAudio) {
        silenceUrl = silenceUrl || makeSilence();
        keepAudio = new Audio(silenceUrl);
        keepAudio.loop = true;
      }
      const p = keepAudio.play();
      if (p && p.catch) p.catch(() => {});
      if ('mediaSession' in navigator && window.MediaMetadata) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: 'Course en cours', artist: 'Piste libre' });
      }
    } catch (e) {}
  }
  function stopKeepAlive() {
    try { if (keepAudio) { keepAudio.pause(); keepAudio.currentTime = 0; } } catch (e) {}
  }
  async function lock() {
    try { if (!wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } } catch (e) {}
  }

  // --- Démarrer / Arrêter ---
  async function start() {
    km = 1; dist = 0; prev = null; steps = 0; stepsKm = 0; lastStep = 0;
    $('cv-msg').textContent = '';

    if (!navigator.geolocation) {
      $('cv-msg').textContent = 'GPS non disponible sur cet appareil.';
      return;
    }

    // iOS : permission capteurs (doit être dans le clic)
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      try { await DeviceMotionEvent.requestPermission(); } catch (e) {}
    }
    addEventListener('devicemotion', onMotion);

    // Débloque la voix + message de départ
    parle('C\'est parti. Bonne course.');

    tStart = tKm = Date.now();
    running = true;
    startKeepAlive();
    lock();
    startWatch();
    timerId = setInterval(draw, 1000);

    $('cv-start').style.display = 'none';
    $('cv-stop').style.display = 'inline-block';
  }

  function stop() {
    if (!running) return;
    running = false;
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    removeEventListener('devicemotion', onMotion);
    clearInterval(timerId); timerId = null;
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    stopKeepAlive();
    parle(`Course terminée. ${(dist / 1000).toFixed(2).replace('.', ',')} kilomètres en ${parle_duree((Date.now() - tStart) / 1000)}.`);
    $('cv-stop').style.display = 'none';
    $('cv-start').style.display = 'inline-block';
  }

  $('cv-start').addEventListener('click', start);
  $('cv-stop').addEventListener('click', stop);

  // Retour à l'écran : on relance GPS, wake lock et son, et on remet l'affichage à jour
  function refresh() {
    if (!running) return;
    lock(); restartWatch();
    if (keepAudio && keepAudio.paused) startKeepAlive();
    draw();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh();
  });
  addEventListener('focus', refresh);
  addEventListener('pageshow', refresh);
})();
</script>
