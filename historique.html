<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes séances — Piste libre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1424;
    --panel: #171d33;
    --line: #2a3250;
    --text: #edf1fb;
    --muted: #9aa5c4;
    --accent: #f7d23e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  a.back { color: var(--muted); text-decoration: none; font-size: 15px; }
  h1 { font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 800;
    font-size: 44px; line-height: 1; margin: 16px 0 20px; }
  .weight { display: flex; align-items: center; gap: 10px; color: var(--muted);
    font-size: 14px; margin-bottom: 20px; }
  .weight input { width: 72px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 16px; }
  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px;
    padding: 24px 16px; line-height: 1.5; }
  .session { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px;
    background: var(--panel); overflow: hidden; }
  .session > button { all: unset; display: block; width: 100%; box-sizing: border-box;
    padding: 16px; cursor: pointer; }
  .session > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .date { color: var(--muted); font-size: 14px; }
  .stats { display: flex; gap: 20px; margin-top: 6px; flex-wrap: wrap; }
  .stat b { font-family: "Barlow Condensed", Impact, sans-serif; font-size: 30px;
    font-weight: 700; display: block; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 13px; }
  .detail { display: none; padding: 0 16px 16px; border-top: 1px solid var(--line); }
  .session.open .detail { display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 400; font-size: 13px; padding: 4px 0; }
  td { padding: 8px 0; font-size: 16px; border-top: 1px solid var(--line); }
  td.km { width: 56px; color: var(--muted); }
  td.pace { width: 96px; font-weight: 500; white-space: nowrap; }
  .bar { height: 8px; border-radius: 4px; background: var(--accent); min-width: 6px; }
  .bar.best { background: #6ee7a0; }
  .del { margin-top: 14px; background: none; color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) { .bar { transition: width .3s; } }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">‹ Retour</a>
  <h1>Mes séances</h1>

  <label class="weight">Mon poids (pour les calories)
    <input id="weight" type="number" inputmode="decimal" min="30" max="250" step="0.5"> kg
  </label>

  <div id="list"></div>
</main>

<script src="historique.js"></script>
<script>
  const H = window.PisteHistorique;
  const listEl = document.getElementById("list");
  const weightEl = document.getElementById("weight");

  weightEl.value = H.getWeight();
  weightEl.addEventListener("change", () => {
    H.setWeight(weightEl.value);
    render(); // recalcule les calories affichées
  });

  function fmtDate(ts) {
    return new Date(ts).toLocaleString("fr-FR", {
      weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit",
    });
  }

  function render() {
    const sessions = H.list();
    const weight = H.getWeight();
    if (!sessions.length) {
      listEl.innerHTML =
        '<div class="empty">Aucune séance enregistrée. Termine une course et elle apparaîtra ici automatiquement.</div>';
      return;
    }
    listEl.innerHTML = "";
    sessions.forEach((s) => {
      const kcal = H.calories(s.distanceM, weight);
      const paceAvg = s.distanceM ? s.durationSec / (s.distanceM / 1000) : 0;
      const secs = s.splits.map((x) => x.sec);
      const best = Math.min(...secs), worst = Math.max(...secs);

      const rows = s.splits.map((x) => {
        // barre plus longue = allure plus rapide
        const w = worst === best ? 100 : 40 + 60 * ((worst - x.sec) / (worst - best));
        const label = x.partial ? (x.meters / 1000).toFixed(2).replace(".", ",") : x.km;
        return `<tr>
          <td class="km">${label}${x.partial ? " km" : ""}</td>
          <td class="pace">${H.fmtPace(x.sec)}</td>
          <td><div class="bar ${x.sec === best && s.splits.length > 1 ? "best" : ""}" style="width:${w}%"></div></td>
        </tr>`;
      }).join("");

      const el = document.createElement("div");
      el.className = "session";
      el.innerHTML = `
        <button aria-expanded="false">
          <div class="date">${fmtDate(s.date)}</div>
          <div class="stats">
            <div class="stat"><b>${(s.distanceM / 1000).toFixed(2).replace(".", ",")}</b><span>km</span></div>
            <div class="stat"><b>${H.fmtDuration(s.durationSec)}</b><span>durée</span></div>
            <div class="stat"><b>${H.fmtPace(paceAvg).replace(" /km", "")}</b><span>allure moy. /km</span></div>
            <div class="stat"><b>${kcal}</b><span>kcal</span></div>
          </div>
        </button>
        <div class="detail">
          <table>
            <thead><tr><th>Km</th><th>Allure</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="3">Moins d’un kilomètre parcouru.</td></tr>'}</tbody>
          </table>
          <button class="del">Supprimer la séance</button>
        </div>`;
      const toggle = el.querySelector("button");
      toggle.addEventListener("click", () => {
        const open = el.classList.toggle("open");
        toggle.setAttribute("aria-expanded", open);
      });
      el.querySelector(".del").addEventListener("click", () => {
        if (confirm("Supprimer cette séance ?")) { H.remove(s.id); render(); }
      });
      listEl.appendChild(el);
    });
  }
  render();
</script>
</body>
</html>
